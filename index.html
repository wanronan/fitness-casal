<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b19"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fitness Casal"><title>Fitness Casal | Wanderson & Fernanda</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf3ee;background:#0d1715}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:800px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#8fbaa4}h1{font-size:28px;letter-spacing:-.05em;margin:5px 0}.muted{color:#9cb4aa}.pill{background:#243b32;border:1px solid #36584a;color:#b9ecd2;border-radius:20px;padding:7px 11px;font-size:12px}.hero{margin:20px 0;padding:20px;border-radius:20px;background:linear-gradient(130deg,#234b38,#162d28);border:1px solid #385745}.hero h2{margin:6px 0 7px;font-size:23px}.hero p{line-height:1.5;margin:0;font-size:13px;color:#c8dbd0}.nav{position:fixed;bottom:0;left:0;right:0;background:#101d19ef;backdrop-filter:blur(15px);border-top:1px solid #2b4239;display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:none;background:transparent;color:#9fb5a9;padding:13px 6px 14px;min-width:19%;font-size:11px}.nav button.active{color:#8dedb8;font-weight:750}.nav .ico{display:block;font-size:20px;margin-bottom:4px}.panel{border:1px solid #2c4238;background:#16221e;border-radius:17px;padding:17px;margin:14px 0}.panel h3{margin:0 0 10px;font-size:17px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs,.days{display:flex;gap:7px;overflow-x:auto;margin:14px 0}.tabs button,.days button{border:1px solid #345046;color:#c7d6ce;background:#1b3028;padding:10px 14px;border-radius:11px;white-space:nowrap}.tabs button.sel,.days button.sel{background:#a4e6b8;border-color:#a4e6b8;color:#11211a;font-weight:800}.meal{padding:13px 0;border-bottom:1px solid #2b4036}.meal:last-child{border-bottom:0}.time{color:#8cb29b;font-size:12px;margin-bottom:6px}.meal strong{display:block;font-size:16px;margin-bottom:5px}.meal .qty{font-size:14px;line-height:1.55;color:#d6e9dc}.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #2a3b33}.check input{width:19px;height:19px;accent-color:#9ce9b4}.check .amount{margin-left:auto;color:#a4c3af;font-size:13px;text-align:right}.small{font-size:12px;line-height:1.55;color:#98b1a4}.progress{background:#30443b;border-radius:20px;overflow:hidden;height:9px;margin:10px 0}.bar{height:100%;background:#8fe2ae;transition:width .2s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#1b3128;border:1px solid #355243;padding:13px;border-radius:13px}.metric b{font-size:23px;display:block;margin:4px 0}.metric span{color:#abc3b3;font-size:12px}input[type=number],input[type=date],textarea{width:100%;padding:12px;background:#0f1c17;border:1px solid #416052;color:#e9f6ed;border-radius:10px;margin-top:5px}label{font-size:13px;color:#b9cebf}.field{margin:11px 0}.primary,.secondary{width:100%;border-radius:12px;padding:12px;border:0;font-weight:750;margin-top:9px}.primary{background:#9fe7b6;color:#102719}.secondary{background:#263e32;color:#d5eadb;border:1px solid #42614e}.notice{background:#233628;border-left:3px solid #93cda2;padding:11px;border-radius:8px;font-size:12px;color:#c5dbcb;line-height:1.5}.hide{display:none}.log{padding:10px 0;border-bottom:1px solid #30483a;font-size:13px}.foot{font-size:11px;color:#809b8d;margin:14px 0;text-align:center}.mark{color:#9ff0c0}.right{font-size:12px;color:#9fc5ad}.empty{text-align:center;padding:25px;color:#9db2a7}
</style></head><body><div class="wrap"><header class="top"><div><div class="eyebrow">Projeto de alimentação</div><h1>Fitness <span class="mark">Casal</span></h1><div class="muted" style="font-size:13px">Wanderson & Fernanda</div></div><span class="pill">PLANO 1.0</span></header><div class="hero"><div class="eyebrow">Nosso foco</div><h2>Menos gordura.<br>Mais força.</h2><p>Um cardápio compartilhado, porções individuais e hábitos que cabem na rotina de vocês.</p></div>
<main id="views"></main><p class="foot">Dados guardados neste navegador. Não há sincronização automática entre aparelhos.</p></div><nav class="nav" id="nav"></nav>
<script>
'use strict';
const STORE='fitness-casal-v1';
const defaultState={person:'w',day:new Date().getDay()===0?6:new Date().getDay()-1,checked:{},done:{},logs:[],tab:'hoje'};
let s;try{s={...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{s={...defaultState}}
const save=()=>localStorage.setItem(STORE,JSON.stringify(s));
const days=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const menu=[
{l:'Frango grelhado, arroz, feijão e cenoura',wl:'180 g de frango + 220 g de arroz + 150 g de feijão + 150 g de vegetais',fl:'120 g de frango + 120 g de arroz + 100 g de feijão + 150 g de vegetais',j:'Frango desfiado com batata e repolho',wj:'180 g de frango + 350 g de batata + 150 g de vegetais',fj:'110 g de frango + 180 g de batata + 150 g de vegetais'},
{l:'Frango ensopado, arroz e feijão',wl:'180 g de frango + 220 g de arroz + 150 g de feijão + 150 g de vegetais',fl:'120 g de frango + 120 g de arroz + 100 g de feijão + 150 g de vegetais',j:'Macarrão com frango desfiado',wj:'200 g de macarrão + 180 g de frango + 150 g de vegetais',fj:'120 g de macarrão + 110 g de frango + 150 g de vegetais'},
{l:'Frango em cubos, batata-doce e feijão',wl:'180 g de frango + 300 g de batata-doce + 150 g de feijão + 150 g de vegetais',fl:'120 g de frango + 150 g de batata-doce + 100 g de feijão + 150 g de vegetais',j:'Arroz com omelete, feijão e legumes',wj:'200 g de arroz + 3 ovos + 150 g de feijão + 150 g de vegetais',fj:'110 g de arroz + 2 ovos + 100 g de feijão + 150 g de vegetais'},
{l:'Frango assado, arroz e feijão',wl:'180 g de frango + 220 g de arroz + 150 g de feijão + 150 g de vegetais',fl:'120 g de frango + 120 g de arroz + 100 g de feijão + 150 g de vegetais',j:'Batata cozida com frango desfiado',wj:'180 g de frango + 350 g de batata + 150 g de vegetais',fj:'110 g de frango + 180 g de batata + 150 g de vegetais'},
{l:'Frango acebolado, arroz e feijão',wl:'180 g de frango + 220 g de arroz + 150 g de feijão + 150 g de vegetais',fl:'120 g de frango + 120 g de arroz + 100 g de feijão + 150 g de vegetais',j:'Macarrão com frango e cenoura',wj:'200 g de macarrão + 180 g de frango + 150 g de vegetais',fj:'120 g de macarrão + 110 g de frango + 150 g de vegetais'},
{l:'Frango assado, batata e salada',wl:'180 g de frango + 350 g de batata + 150 g de vegetais',fl:'120 g de frango + 180 g de batata + 150 g de vegetais',j:'Arroz, feijão e omelete',wj:'200 g de arroz + 3 ovos + 150 g de feijão + 150 g de vegetais',fj:'110 g de arroz + 2 ovos + 100 g de feijão + 150 g de vegetais'},
{l:'Frango de panela, arroz e feijão',wl:'180 g de frango + 220 g de arroz + 150 g de feijão + 150 g de vegetais',fl:'120 g de frango + 120 g de arroz + 100 g de feijão + 150 g de vegetais',j:'Frango, batata-doce e legumes',wj:'180 g de frango + 350 g de batata-doce + 150 g de vegetais',fj:'110 g de frango + 180 g de batata-doce + 150 g de vegetais'}];
const shopping=[['Frango sem osso','4,8–5,2 kg'],['Ovos','60 unidades'],['Arroz cru','1,5 kg'],['Feijão cru','1 kg'],['Batata e batata-doce','3,5–4 kg'],['Macarrão cru','500 g'],['Cenoura, repolho e verduras','4–4,5 kg'],['Banana e frutas da estação','28 unidades'],['Pão de forma','2 pacotes'],['Leite','3 litros'],['Iogurte natural','7 unidades'],['Aveia','200 g'],['Óleo, molho e temperos','Conforme uso']];
function pick(p){s.person=p;save();render()}
function day(i){s.day=i;save();render()}
function tab(t){s.tab=t;save();render()}
const who=()=>s.person==='w'?'Wanderson':'Fernanda';
function tabs(){return `<div class="tabs"><button class="${s.person==='w'?'sel':''}" onclick="pick('w')">💪 Wanderson</button><button class="${s.person==='f'?'sel':''}" onclick="pick('f')">🌿 Fernanda</button></div>`}
function markMeal(key){s.done[key]=!s.done[key];save();render()}
function meal(name,time,desc,portion,key){let checked=!!s.done[key];return `<div class="meal"><div class="row"><div class="time">${time}</div><label><input type="checkbox" ${checked?'checked':''} onchange="markMeal('${key}')"> Feito</label></div><strong>${name}</strong><div class="qty">${desc}${portion?`<br><span class="mark">${portion}</span>`:''}</div></div>`}
function renderToday(){let m=menu[s.day],p=s.person;return `${tabs()}<div class="days">${days.map((d,i)=>`<button onclick="day(${i})" class="${i===s.day?'sel':''}">${d.slice(0,3)}</button>`).join('')}</div><div class="panel"><div class="row"><h3>🍽️ ${days[s.day]} • ${who()}</h3><span class="right">Porções prontas</span></div>${meal('Café da manhã','07h30',p==='w'?'3 ovos + 2 fatias de pão + café com 200 ml de leite + 1 banana':'2 ovos + 1 fatia de pão + café com 100 ml de leite + 1 banana',null,`${p}-${s.day}-c`)}${meal(m.l,'13h • Almoço','',m[p+'l'],`${p}-${s.day}-l`)}${meal('Lanche','16h30',p==='w'?'2 ovos + 2 fatias de pão + 1 fruta':'170 g de iogurte natural + 20 g de aveia + 1 fruta',null,`${p}-${s.day}-s`)}${meal(m.j,'20h • Jantar','',m[p+'j'],`${p}-${s.day}-j`)}</div><div class="notice">⚠️ Plano inicial de teste: quantidades de calorias e proteína ainda não estão validadas por cálculo completo. A lista de compras e as metas são estimativas. Confira os ajustes com nutricionista.</div><div class="panel"><h3>🎯 Referências do dia</h3><div class="grid"><div class="metric"><span>Energia desejada</span><b>${p==='w'?'2.600':'1.600'}</b><span>kcal/dia (estimativa)</span></div><div class="metric"><span>Proteína desejada</span><b>${p==='w'?'160–180':'100–115'}</b><span>g/dia (estimativa)</span></div></div><p class="small">Os valores de referência não são soma automática das refeições. Pese os alimentos prontos. Considere o óleo utilizado no preparo.</p></div>`}
function renderShopping(){let n=shopping.filter((_,i)=>s.checked[i]).length;return `<div class="panel"><div class="row"><h3>🛒 Compras da semana</h3><span class="right">${n}/${shopping.length}</span></div><div class="progress"><div class="bar" style="width:${100*n/shopping.length}%"></div></div>${shopping.map(([x,y],i)=>`<label class="check"><input type="checkbox" ${s.checked[i]?'checked':''} onchange="toggleShop(${i})"><span style="${s.checked[i]?'text-decoration:line-through;opacity:.55':''}">${x}</span><span class="amount">${y}</span></label>`).join('')}<button class="secondary" onclick="resetShop()">Desmarcar tudo</button><button class="primary" onclick="shareShop()">📋 Copiar lista</button></div><div class="notice">💰 Orçamento: R$ 200–300/semana para o casal. A lista completa foi estimada em R$ 261–387 e pode ultrapassar o teto. Antes das compras, confira os preços e ajuste os ingredientes.</div>`}
function toggleShop(i){s.checked[i]=!s.checked[i];save();render()}
function resetShop(){if(confirm('Desmarcar todos os itens?')){s.checked={};save();render()}}
async function shareShop(){let t=shopping.map(([x,y],i)=>`${s.checked[i]?'☑':'☐'} ${x}: ${y}`).join('\n');try{await navigator.clipboard.writeText(t);alert('Lista copiada!')}catch{prompt('Copie a lista:',t)}}
function renderProgress(){let l=s.logs.filter(x=>x.person===s.person).sort((a,b)=>b.date.localeCompare(a.date));return `${tabs()}<div class="panel"><h3>📊 Registrar evolução</h3><p class="small">Registre uma vez por semana e compare tendências, não oscilações de um dia.</p><form onsubmit="saveLog(event)"><div class="field"><label>Data<input id="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label></div><div class="grid"><div class="field"><label>Peso (kg)<input id="weight" type="number" min="25" max="350" step="0.1" required placeholder="${s.person==='w'?'105':'70'}"></label></div><div class="field"><label>Cintura (cm)<input id="waist" type="number" min="35" max="250" step="0.1" placeholder="${s.person==='w'?'100':'Opcional'}"></label></div></div><div class="field"><label>Notas da semana<textarea id="notes" rows="2" placeholder="Fome, força, sono, cardio..."></textarea></label></div><button class="primary" type="submit">Salvar avaliação</button></form></div><div class="panel"><h3>📅 Histórico • ${who()}</h3>${l.length?l.map(x=>`<div class="log"><b>${x.date.split('-').reverse().join('/')} • ${x.weight} kg</b>${x.waist?` • cintura ${x.waist} cm`:''}<br><span class="small">${escapeHtml(x.notes||'Sem observações')}</span></div>`).join(''):'<div class="empty">Nenhum registro ainda.</div>'}<button class="secondary" onclick="exportData()">⬇ Exportar registros (backup)</button></div>`}
function escapeHtml(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveLog(e){e.preventDefault();let date=document.querySelector('#date').value, weight=Number(document.querySelector('#weight').value),waist=document.querySelector('#waist').value,notes=document.querySelector('#notes').value;if(!date||!Number.isFinite(weight)||weight<25||weight>350){alert('Confira o peso e a data');return}if(waist&&(Number(waist)<35||Number(waist)>250)){alert('Confira a cintura');return}let person=s.person;s.logs=s.logs.filter(x=>!(x.person===person&&x.date===date));s.logs.push({person,date,weight,waist,notes});save();render()}
function exportData(){let blob=new Blob([JSON.stringify({app:'Fitness Casal',exportedAt:new Date().toISOString(),data:s},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='fitness-casal-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let o=JSON.parse(t);if(!o.data||!Array.isArray(o.data.logs))throw Error('Formato inválido');if(confirm('Substituir os dados deste navegador pelos do arquivo?')){s={...defaultState,...o.data};save();render()}}).catch(()=>alert('Arquivo de backup inválido.'))}
function renderRoutine(){return `<div class="panel"><h3>🏋️ Movimento</h3><div class="metric"><span>Wanderson</span><b>5×</b><span>musculação por semana; incluir cardio moderado gradualmente, 2 a 3 vezes por 20 a 30 minutos</span></div><br><div class="metric"><span>Fernanda</span><b>3×</b><span>musculação por semana para começar; caminhadas leves e evolução gradual</span></div><p class="small">Cardio e exercício devem respeitar condicionamento e qualquer orientação clínica aplicável.</p></div><div class="panel"><h3>🥘 Cozinha prática</h3><div class="meal"><strong>Domingo</strong><div class="qty">Prepare arroz, feijão, frango e legumes para 3 dias; congele as porções que não serão consumidas em até 3–4 dias.</div></div><div class="meal"><strong>Quarta-feira</strong><div class="qty">Faça a segunda preparação da semana. Descongele sob refrigeração e varie os temperos.</div></div><div class="meal"><strong>Pesagem</strong><div class="qty">As porções do cardápio são dos alimentos já cozidos, prontos para servir.</div></div></div><div class="panel"><h3>🔐 Seus dados</h3><p class="small">O acompanhamento fica salvo apenas neste navegador e aparelho. Limpar dados do navegador pode apagar o histórico. Faça backups periodicamente.</p><button class="primary" onclick="exportData()">Exportar backup</button><label style="display:block;margin-top:15px">Restaurar backup de arquivo JSON<input style="display:block;margin-top:8px;width:100%" type="file" accept="application/json" onchange="importData(event)"></label></div>`}
const navigation=[['hoje','🍽️','Cardápio'],['compras','🛒','Compras'],['progresso','📊','Evolução'],['rotina','🏋️','Rotina']];
function render(){document.getElementById('views').innerHTML=({hoje:renderToday,compras:renderShopping,progresso:renderProgress,rotina:renderRoutine}[s.tab]||renderToday)();document.getElementById('nav').innerHTML=navigation.map(([id,ico,label])=>`<button class="${s.tab===id?'active':''}" onclick="tab('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')}
render();
</script><script>if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }</script></body></html>
